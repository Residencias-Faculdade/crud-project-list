<h1>PROJETOS</h1>

<table>

    <thead>
        <tr>
            <th class="id">ID</th>
            <th>Nome do Projeto</th>
            <th>Ambiente</th>
            <th class="acoes">Ações</th>
        </tr>
    </thead>

    <tbody>
        @for(projeto of projetosRecebidos(); track projeto.id){
        <tr (click)="capturarEventos($event, 'SELECIONAR',projeto.id)">
            <td>{{projeto.id}}</td>
            <td>{{projeto.nome}}</td>
            <td>
                @if (projeto.ambiente == "dev") {
                <span class="ambiente dev">{{projeto.ambiente}}</span>
                }@else {
                    <span class="ambiente prod">{{projeto.ambiente}}</span>
                }
            </td>
            <td>
                <button class="editar" (click)="capturarEventos($event, 'EDITAR',projeto.id)">
                    Editar
                </button>
                <button class="excluir" (click)="capturarEventos($event, 'EXCLUIR',projeto.id)">
                    Excluir
                </button>
            </td>
        </tr>
        }
    </tbody>

</table>

<div class="divBtnAdicion">
    <button class="adicionar" (click)="enviarEventTelaNovoProjeto()">
        Adicionar
    </button>
</div>
