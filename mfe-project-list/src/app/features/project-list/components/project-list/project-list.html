<h1>PROJETOS</h1>

<div class="barra">

    <button class="adicionar">
        Adicionar
    </button>

    <input type="text" class="filtro" placeholder="Filtro">

    <button class="filtrar">
        Filtrar
    </button>

</div>

<table>

    <thead>
        <tr>
            <th class="id">ID</th>
            <th>Nome do Projeto</th>
            <th>Ambiente</th>
            <th class="acoes">Ações</th>
        </tr>
    </thead>

    <tbody>

        @for(projeto of projetosRecebidos(); track projeto.id){
        <tr>
            <td>{{projeto.id}}</td>
            <td>{{projeto.nome}}</td>
            <td>{{projeto.ambiente}}</td>
            <td>
                <button class="editar" (click)="enviarEventEdicao(projeto.id)">
                    Editar
                </button>
                <button class="excluir" (click)="enviarEventExclusao(projeto.id)">
                    Excluir
                </button>
            </td>
        </tr>
        }

    </tbody>

</table>
