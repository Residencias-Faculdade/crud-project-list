<h1>PROJETOS</h1>
<form action="/projetos/cadastar" method="post">

    @if(receberExibicao() != "CRIAR"){
    <label for="Id">Id</label>
    <input type="text" id="Id" name="Id" placeholder="Número do Id" disabled [(ngModel)]="bindingDadosProjeto.id">
    }

    <label for="Projetos">Projetos</label>
    <input type="text" id="Projetos" name="Projetos" placeholder="Nome do Projeto"
        [(ngModel)]="bindingDadosProjeto.nome">

    <label for="Ambiente">Ambiente</label>
    <select id="ambiente" name="Ambiente" [(ngModel)]="bindingDadosProjeto.ambiente">
        <option value="dev" selected>Dev</option>
        <option value="prod">Prod</option>
    </select>



    <div class="divAcoes">
        <button type="button" class="btnVoltar" (click)="enviarEventVoltarPagina()">
            Voltar
        </button>

        @if(receberExibicao() == "CRIAR"){
        <button type="button" class="btnCriar" (click)="enviarEventOperacaoRealizada('CRIAR')">
            Criar
        </button>
        }@else {
        <button type="button" class="btnEditar" (click)="enviarEventOperacaoRealizada('EDITAR')">
            Editar
        </button>
        }
    </div>

</form>
<a href="">DÚVIDAS!</a>
