@if(this.pagina() == "LIST"){
   <app-project-list
   (eventProjetoSelecionado)="escutarEventoProjetoSelecionado($event)"
   (eventEdicao)="escutarEventoTelaEdicao($event)"
   (eventTelaNovoProjeto)="escutarEventoTelaCriacao()"
   [projetosRecebidos]="repassarDadosProjetos()"
   (eventExclusao)="escutarEventoExclusao($event)">
   </app-project-list> 
}@else {
    <app-project-form
    [receberDadosEdicao]="repassarDadosEdicao"
    [receberExibicao]="repassarModeloExibicao"
    (eventVoltarPagina)="escutarEventoVoltarPagina()"
    (eventOperacaoRealizada)="escutarEventoOperacao($event)">
    </app-project-form>
}

@if (modalErroAberto) {
<div class="modal-overlay" (click)="fecharModalErro()">
    <div class="modal" (click)="$event.stopPropagation()">
        <h2>Atenção</h2>
        <p>{{ modalErroMsg }}</p>
        <div class="modal-actions">
            <button class="btn-confirm" (click)="fecharModalErro()">OK</button>
        </div>
    </div>
</div>
}
